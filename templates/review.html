<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Ticket #{{ ticket[0] }} - MediPlus Pharmacy</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f8; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .ticket-info { background: #ecf0f1; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #34495e; }
        textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-family: inherit; font-size: 14px; box-sizing: border-box; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border: none; border-radius: 4px; color: white; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn-approve { background-color: #2ecc71; }
        .btn-approve:hover { background-color: #27ae60; }
        .btn-save { background-color: #3498db; }
        .btn-save:hover { background-color: #2980b9; }
        .btn-cancel { background-color: #95a5a6; }
        .btn-cancel:hover { background-color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Review & Edit Ticket #{{ ticket[0] }}</h1>

    <div class="ticket-info">
        <h3>Subject: {{ ticket[1] }}</h3>
        <p><strong>Customer Content:</strong> {{ ticket[2] }}</p>
        <p><strong>Current Status:</strong> <span>{{ ticket[4] }}</span></p>
    </div>

    <form action="/review/{{ ticket[0] }}" method="post">
        <label for="draft_reply">Generated AI Draft Reply (Editable):</label>
        <textarea id="draft_reply" name="draft_reply" rows="6" required>{{ ticket[3] or '' }}</textarea>

        <label for="comment">Internal Reviewer Comment:</label>
        <textarea id="comment" name="comment" rows="3" placeholder="Add staff feedback or reason for edit...">{{ ticket[5] or '' }}</textarea>

        <div class="btn-group">
            <button type="submit" name="action" value="approve" class="btn btn-approve">Approve & Mark Reviewed</button>
            <button type="submit" name="action" value="save" class="btn btn-save">Save as Draft</button>
            <a href="/" class="btn btn-cancel">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>
