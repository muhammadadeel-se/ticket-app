<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Ticket - MediPlus Pharmacy</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f8; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 750px; margin: auto; }
        h1 { color: #2c3e50; }
        .ticket-info { background: #f8fafc; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .metric-box { background: #eef2f7; padding: 10px 15px; border-radius: 6px; margin-top: 8px; margin-bottom: 20px; font-weight: bold; color: #334155; border: 1px solid #cbd5e1; display: flex; gap: 15px; }
        .metric-pill { background: white; padding: 4px 8px; border-radius: 4px; border: 1px solid #94a3b8; font-size: 13px; color: #0f172a; }
        textarea { width: 100%; height: 150px; padding: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        .btn { padding: 10px 18px; background-color: #009688; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; text-decoration: none; margin-right: 10px; }
        .btn-secondary { background-color: #64748b; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Review Ticket #{{ ticket[0] }}</h1>
        
        <div class="ticket-info">
            <p><strong>Subject:</strong> {{ ticket[1] }}</p>
            <p><strong>Customer Query:</strong> {{ ticket[2] }}</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="draft_reply">Draft Reply (Editable):</label>
                <textarea name="draft_reply" id="draft_reply" oninput="updateCharCount()">{{ ticket[3] or '' }}</textarea>
                
                <!-- Evaluation Metrics Displayed After Textarea -->
                <div class="metric-box">
                    <span>📊 Draft Metrics:</span>
                    <span class="metric-pill" id="char-metric">Length: {{ ticket[6] or 0 }} chars</span>
                    <span class="metric-pill" id="tok-metric">Tokens: {{ ticket[7] or 0 }}</span>
                </div>
            </div>

            <div class="form-group">
                <label for="comment">Internal Reviewer Comments:</label>
                <textarea name="comment" style="height: 80px;" placeholder="Add internal notes...">{{ ticket[5] or '' }}</textarea>
            </div>

            <button type="submit" name="action" value="save" class="btn btn-secondary">Save as Draft</button>
            <button type="submit" name="action" value="approve" class="btn">Approve & Mark Reviewed</button>
            <a href="/" class="btn btn-secondary" style="background-color: #94a3b8;">Back to Dashboard</a>
        </form>
    </div>

    <script>
        function updateCharCount() {
            const text = document.getElementById('draft_reply').value;
            document.getElementById('char-metric').innerText = "Length: " + text.length + " chars";
        }
    </script>
</body>
</html>
